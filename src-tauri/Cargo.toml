[package]
name = "nuphus-desktop"
version = "0.2.26"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/mrpulor-gh/nuphus"
description = "Nuphus - 协同共生桌面助手 (Tauri Desktop)"
authors = ["Nuphus Team"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true

[dependencies]
# Nuphus Core
nuphus = { path = "../src" }
nuphus-index = { path = "../crates/nuphus-index" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# IDs & Time
uuid = "1"
chrono = "0.4"

# Logging
tracing = "0.1"

# Async Runtime
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }

# Process enumeration (CDP browser detection: find --remote-debugging-port)
sysinfo = "0.32"

# 门铃 HTTP server + 移动端局域网 server（复用 workspace 已有的 axum 0.7，与 desktop-api 同版本）
# ws feature: mobile_server 的 /ws 事件推流（axum 自带，不引 tokio-tungstenite）
axum = { version = "0.7", features = ["macros", "ws"] }

# 静态资源 gzip/brotli 压缩（mobile_server 资源路由）：主入口 JS 850KB→gzip ~253KB，
# 隧道冷启动传输量降 3.4 倍——跨境丢包链路 8s load-guard 的主要触发源（实测反馈）。
# axum 0.7 对应 tower-http 0.5 系（workspace 锁文件里的 0.6 是 axum 0.8 生态，勿对齐）。
tower-http = { version = "0.5", features = ["compression-gzip", "compression-br"] }

# WebSocket split（SinkExt/StreamExt）——workspace 依赖树已有，mobile_server /ws 推流使用
futures-util = "0.3"

# 中继客户端出站 WebSocket（relay_client.rs，对齐 axum 0.7 内部的 0.24 版本）
# native-tls：wss:// 需 TLS（Windows=schannel / macOS=Security-Framework / Linux=OpenSSL，走系统信任库）
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

# TCP keepalive（relay_client 防 NAT 空闲掐断半死连接）
socket2 = "0.5"

# WS 握手 Authorization Header（tungstenite IntoClientRequest 返回 http::Request）
http = "1"

# HTTP (blocking, for lightweight API queries like /models)
reqwest = { version = "0.12", features = ["blocking", "multipart"] }


# TOML
toml = "0.8"

# Async
async-trait = "0.1"

# Image processing (for capture overlay — crop + PNG preview encoding;
# tools/image.rs — compress/convert/resize/info/stitch，gif/webp 为转换输出支持)
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp"] }

# PDF 处理（commands/tools/pdf.rs：merge/compress/page_count/extract_text）
# 与 nuphus core（src/utils/office.rs read_pdf）共用同一 lopdf 0.34，不引入新版本
# embed_image: 图片转 PDF（xobject::image + insert_image 嵌入图片流）
lopdf = { version = "0.34", features = ["embed_image"] }
flate2 = "1"

# xcap screen capture (used directly in toolbar.rs for overlay screenshots)
xcap.workspace = true

# 文件系统
dirs = "5"

# Audio capture (STT microphone input, WASAPI on Windows)
cpal = "0.15"

# SQLite (bundled, for memory system command helpers)
rusqlite = { version = "0.31", features = ["bundled"] }

# Base64
base64 = "0.22"

# ZIP extraction (ffmpeg release archive → bin/ffmpeg.exe + bin/ffprobe.exe；
# 应用插件安装器 plugin_apps.rs 复用同一 zip 1.x 依赖——.nuph 包解压)
zip = { version = "1.1", default-features = false, features = ["deflate"] }

# Hex编码
hex = "0.4"

# SHA256 (插件包完整性校验 sha256_file + mobile_server 配对密码哈希；非 Windows 平台 API Key 加密密钥派生——路线图，当前 Windows 走 DPAPI)
sha2 = "0.10"

# unstable：浏览器壳+子 webview 架构需要 WindowBuilder / WebviewBuilder / add_child
# （tauri 2.x 这几项均在 unstable 之后；Manager::get_window/windows/get_webview 同理）。
# 版本已锁 2.11.5（Cargo.lock），API 面漂移风险可控。见 docs/browser-shell-arch.md。
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"

# Windows API（emitter.rs 置前不抢焦点：SetWindowPos + SWP_NOACTIVATE）
# 用 windows-sys 而非 windows crate——tauri 内部依赖 windows-sys，
# 避免 windows_core 多版本导致 Param trait 类型冲突。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # 无边框窗口的 Win11 系统圆角（DwmSetWindowAttribute + CORNER_PREFERENCE）
    "Win32_Graphics_Dwm",
    # ── 以下为截图新链路（commands/capture/）所需，见 docs/capture-refactor-plan.md ──
    # 按屏幕坐标抓取矩形：BitBlt / GetDIBits / CreateCompatibleDC / GetDIBits
    # 显示器枚举与物理边界：MonitorFromPoint / GetMonitorInfoW（同在 Gdi 模块）
    "Win32_Graphics_Gdi",
    # 光标位置：GetCursorPos；双击阈值：GetDoubleClickTime
    "Win32_UI_Input_KeyboardAndMouse",
] }

# Linux 原生遮罩：X11 纯 Rust 协议实现（x11rb）。
# ⚠️ 2026-10-05：`commands/capture/wip/linux.rs` 尚未完成（x11rb API 漂移 + 从未编译通过），
# 未接入编译；非 Windows 平台截图走 WebView overlay 兜底链路。完成并真机验证后再恢复本段
# 与 `surface/mod.rs` 的模块声明（版本需与 core/src/Cargo.toml 的 linux 段一致，共用同一份 lock）。
# [target.'cfg(target_os = "linux")'.dependencies]
# x11rb = "0.13"

# macOS 专属 tauri feature：HUD overlay 透明窗口（hud.rs transparent）需要 macos-private-api；
# 同一依赖在 target 段声明，features 与通用段自动合并（非 macOS 平台不启用该 feature，
# 避免 tauri-build 的 "remove the macos-private-api feature" 报错）。
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = [
    "AVCaptureDevice",
    "AVMediaFormat",
] }
# macOS 原生遮罩（commands/capture/wip/macos.rs）：AppKit 窗口 + CoreGraphics 位图 + block2。
# ⚠️ 2026-10-05：该实现尚未完成——依赖图里同时存在 objc2 0.5.2（enigo→icrate→block2 0.4）
# 与 0.6.4（objc2-foundation 0.3.2 一线），`Retained<AnyObject>` 的 Encode / MessageReceiver /
# ConvertReturn 系列 trait 不满足，且 `MacState` 缺 `scale` 字段；该文件从未编译通过，
# 未接入编译。完成移植（统一 objc2 版本口径或整体改用 0.6.4 API）并真机验证后，
# 再恢复本段依赖与 `surface/mod.rs` 的模块声明。
# objc2 = "0.6"
# objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }
# objc2-core-graphics = "0.3.2"
# block2 = "0.6"

[dev-dependencies]
tokio-test = "0.4"
# test feature: mobile_server 集成测试用 mock_app 驱动完整 submit_user_message 调用链
# （仅测试构建生效，不进入生产二进制）
tauri = { version = "2", features = ["test"] }
# 测试中启用 tracing 输出（诊断 server 错误路径）
tracing-subscriber = "0.3"

[[bin]]
name = "nuphus"
path = "src/main.rs"

# 可选特性：插件市场（默认关闭）。开启后编译 plugin_market_install 命令；
# 开源基础版不包含市场，保持此特性关闭即可独立构建。
[features]
default = []
market = []