name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: nuphus_linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nuphus_windows_amd64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev libfuse2 squashfs-tools

      - name: Install frontend deps
        run: |
          npm ci
          cd frontend && npm ci

      # ── 1. 安装包（Tauri bundle：Windows→msi / macOS→dmg / Linux→deb+AppImage）──
      # 模型库不打包（B 方案）：首次启动由 build.rs/bootstrap 自动下载。
      # APPIMAGE_EXTRACT_AND_RUN=1：GitHub runner 上 AppImage（linuxdeploy）FUSE 挂载不可用，
      # 解压到临时目录运行（tauri 官方 CI 模板做法；解压需 unsquashfs → squashfs-tools）。
      - name: Verify linuxdeploy executable
        if: runner.os == 'Linux'
        run: |
          curl -sL -o /tmp/linuxdeploy.AppImage https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          chmod +x /tmp/linuxdeploy.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage --version || APPIMAGE_EXTRACT_AND_RUN=1 /tmp/linuxdeploy.AppImage --help || true
      - name: Build installer (tauri bundle)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npx tauri build

      # ── 2. 便携包（绿色版：解压即用，技术用户/开发者通道）──
      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp target/release/nuphus release/
          cp -r plugin release/
          cp README.md LICENSE PRIVACY.md config.example.toml release/
          cp -r src-tauri/desktop release/desktop
          cp release/desktop/sherpa/libsherpa-onnx-c-api.so release/desktop/sherpa/libonnxruntime.so release/desktop/sherpa/libonnxruntime_providers_shared.so release/
          # rpath：exe 与 .so 同目录加载（release 目录不在默认 LD_LIBRARY_PATH）
          patchelf --set-rpath '$ORIGIN' release/nuphus
          for so in release/*.so; do patchelf --set-rpath '$ORIGIN' "$so"; done
          cd release && tar czf ../${{ matrix.artifact }}.tar.gz *
      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item target/release/nuphus.exe release/
          Copy-Item -Recurse plugin release/
          Copy-Item README.md, LICENSE, PRIVACY.md, config.example.toml release/
          Copy-Item -Recurse src-tauri/desktop release/desktop
          # sherpa c-api + onnxruntime 拷到 exe 同目录（ORT load-dynamic / sherpa c-api 按名加载）
          Copy-Item src-tauri/desktop/sherpa/sherpa-onnx-c-api.dll, src-tauri/desktop/sherpa/onnxruntime.dll, src-tauri/desktop/sherpa/onnxruntime_providers_shared.dll release/
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact }}.zip

      # ── 3. msi 重命名：去掉 tauri 默认附加的语言后缀（en-US）──
      # tauri v2 msi 命名含系统 locale（Nuphus_0.1.1_x64_en-US.msi），
      # 与产品内容无关；统一为标准 Windows 命名 Nuphus_0.1.1_x64.msi。
      - name: Rename MSI (strip locale suffix)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "target/release/bundle/msi/*.msi" | ForEach-Object {
            $newName = $_.Name -replace '_[a-zA-Z]{2,3}-[a-zA-Z]{2,4}\.msi$', '.msi'
            if ($newName -ne $_.Name) {
              Write-Output "Rename $($_.Name) -> $newName"
              Rename-Item $_.FullName $newName -Force
            }
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            nuphus_*.tar.gz
            nuphus_*.zip
          generate_release_notes: true