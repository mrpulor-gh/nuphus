name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # FIX 1: 保持 ubuntu-24.04
          # 22.04 无 webkit2gtk-2.40（tauri 2.11.5 要求 v2_40 feature），无法编译。
          # AppImage 打包：2026-08-23 已在 VPS(Ubuntu 26.04) 用 CI 等价依赖
          # (libgtk-3-dev/librsvg2-dev/patchelf/squashfs-tools/desktop-file-utils 等)
          # + 真实 Nuphus 二进制完整跑通 tauri linuxdeploy 流水线(exit 0)。
          # v0.1.4 Linux job 失败为瞬时下载损坏（报错距 AppImage 打包 <1s 即挂、
          # v0.1.3→v0.1.4 无任何原生依赖变更），故保留 appimage。
          # 构建命令带 --verbose：让 tauri 把 linuxdeploy 的 stdout/stderr 写入 CI 日志，
          # 避免再次"failed to run linuxdeploy"却无任何输出（tauri 默认全吞）。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: nuphus_linux_amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: nuphus_windows_amd64
          # macOS: macos-14 免费 runner 为 Apple Silicon (arm64)，产物为原生 aarch64 app。
          # build.rs macOS sherpa 源已切换 osx-universal2（含 x86_64+arm64 双 slice）。
          # dmg 打包在 CI 无头环境 hdiutil 失败（待攻关），当前打 .app + zip 发布。
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: nuphus_macos_arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # FIX 2: 添加 prefix-key，避免 24.04/22.04 缓存互相污染
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev libfuse2 squashfs-tools libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev file desktop-file-utils

      - name: Install frontend deps
        run: |
          npm ci
          cd frontend && npm ci

      # macOS: --bundles app（.app 构建；dmg 由下一步手动 hdiutil 创建——
      # tauri bundle_dmg.sh 的 stderr 被吞无法诊断，手动命令的失败信息直接可见）
      - name: Build installer (tauri bundle)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx tauri build --verbose ${{ runner.os == 'Linux' && '--bundles deb,appimage' || runner.os == 'macOS' && '--bundles app' || '' }}

      - name: Deep-sign dylibs & verify (macOS)
        if: runner.os == 'macOS'
        run: |
          APP_PATH="target/release/bundle/macos/Nuphus.app"
          # macOS：tauri 只签主二进制，bundle.macOS.files 拷入 Contents/Frameworks 的
          # sherpa/onnxruntime dylib 是预编译 adhoc 签名；必须深签名，否则用户侧
          # 直接 SIGKILL (Code Signature Invalid)。
          # 优先使用配置的签名身份；未配置时退化为 adhoc（用于 CI 验证签名链路）。
          SIGN_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          codesign --force --deep --sign "$SIGN_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"
          echo "macOS deep-sign + verify OK ($APP_PATH)"

      - name: Create DMG (macOS, manual hdiutil)
        if: runner.os == 'macOS'
        run: |
          df -h / | tail -1
          cd target/release/bundle/macos
          # 手动 hdiutil create -srcfolder：一步创建，无需 attach/detach/AppleScript，
          # 是 dmg 打包最简可靠方式；GitHub Actions 直接显示 stderr 便于诊断
          hdiutil create -volname "Nuphus" -srcfolder Nuphus.app -ov -format UDZO ../../../../${{ matrix.artifact }}.dmg
          ls -lh ../../../../${{ matrix.artifact }}.dmg

      - name: Package portable (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          cp target/release/nuphus release/
          cp -r plugin release/
          cp README.md LICENSE PRIVACY.md config.example.toml release/
          cp -r src-tauri/desktop release/desktop
          # FIX 4: 安全复制 .so 文件，避免 libonnxruntime_providers_shared.so 不存在时失败
          cp release/desktop/sherpa/libsherpa-onnx-c-api.so release/desktop/sherpa/libonnxruntime.so release/ 2>/dev/null || true
          if [ -f "release/desktop/sherpa/libonnxruntime_providers_shared.so" ]; then
            cp release/desktop/sherpa/libonnxruntime_providers_shared.so release/
          fi
          patchelf --set-rpath '$ORIGIN' release/nuphus
          for so in release/*.so; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so"
          done
          cd release && tar czf ../${{ matrix.artifact }}.tar.gz *

      - name: Package portable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force
          Copy-Item target/release/nuphus.exe release/
          Copy-Item -Recurse plugin release/
          Copy-Item README.md, LICENSE, PRIVACY.md, config.example.toml release/
          Copy-Item -Recurse src-tauri/desktop release/desktop
          Copy-Item src-tauri/desktop/sherpa/sherpa-onnx-c-api.dll, src-tauri/desktop/sherpa/onnxruntime.dll, src-tauri/desktop/sherpa/onnxruntime_providers_shared.dll release/ -ErrorAction SilentlyContinue
          Compress-Archive -Path release/* -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package portable (macOS)
        if: runner.os == 'macOS'
        run: |
          # .app 应用包 zip —— macOS 分发主产物（dmg 在 CI 无头环境待攻关）。
          # zip -y 保留符号链接（框架内 dylib 的 symlink 结构）
          cd target/release/bundle/macos
          zip -r -y ../../../../${{ matrix.artifact }}.zip Nuphus.app

      - name: Collect NSIS installer (per-user)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem "target/release/bundle/nsis/*.exe" | ForEach-Object {
            Write-Output "NSIS installer: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)"
          }

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            nuphus_macos_*.dmg
            nuphus_*.tar.gz
            nuphus_*.zip
          generate_release_notes: true