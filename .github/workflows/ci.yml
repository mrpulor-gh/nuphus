name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check compilation
        run: cargo check --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev
      - name: Run tests
        run: cargo test --workspace

  check-macos:
    name: Check (macOS arm64)
    # macos-14 免费 runner 为 Apple Silicon (arm64)，原生 aarch64 编译验证。
    # cargo check 会执行 build.rs（自动下载 sherpa universal2 + 模型），快速暴露 macOS 编译错误。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --workspace

  smoke-macos:
    name: Smoke (macOS launch)
    # 无 Mac 硬件的启动验证：macOS runner 有 WindowServer，可运行 GUI 程序。
    # tauri build --debug --no-bundle 产出可独立运行的 debug 二进制（内置前端资源），
    # 启动后检查进程存活（未崩溃）即通过。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          npm ci
          cd frontend && npm ci
      - name: Build (debug, no-bundle)
        run: npx tauri build --debug --no-bundle
      - name: Launch smoke test
        run: |
          ./target/debug/nuphus > /tmp/nuphus_smoke.log 2>&1 &
          APP_PID=$!
          sleep 12
          if kill -0 $APP_PID 2>/dev/null; then
            echo "APP ALIVE (pid=$APP_PID)"
            kill $APP_PID || true
          else
            echo "APP CRASHED — last log lines:"
            tail -30 /tmp/nuphus_smoke.log || true
            exit 1
          fi

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 4 requires Node >= 20 (ERR_REQUIRE_ESM on Node 18)
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint check
        run: npx eslint . --ext .ts,.tsx
      - name: Vitest
        # --no-file-parallelism: CI 低资源 runner 上 fork worker 偶发启动失败
        run: npx vitest run --no-file-parallelism
      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"