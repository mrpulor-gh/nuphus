name: CI

on:
  # 日常提交（push 到 main）不触发 CI：界面/文案类改动靠本地 tsc/vitest/cargo check 把关，
  # 发布时集中跑一次（打 v* tag 由 release 流程触发），需要时也可手动 dispatch。
  push:
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Check compilation
        run: cargo check --workspace

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libpipewire-0.3-dev libasound2-dev libgbm-dev libxdo-dev
      - name: Run tests
        run: cargo test --workspace

  check-macos:
    name: Check (macOS arm64)
    # macos-14 免费 runner 为 Apple Silicon (arm64)，原生 aarch64 编译验证。
    # cargo check 会执行 build.rs（自动下载 sherpa universal2 + 模型），快速暴露 macOS 编译错误。
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check compilation
        run: cargo check --workspace

      - name: Test macOS RPA contracts
        run: |
          cargo test -p nuphus --lib desktop_automation::
          cargo test -p nuphus --lib tools::semantic_desktop::
          cargo test -p nuphus --lib tools::registry::tests::
          cargo test -p nuphus --lib desktop::
          cargo test -p desktop-api --lib
          cargo test -p nuphus-desktop --bin nuphus macos_permissions::
          cargo test -p nuphus-desktop --bin nuphus commands::config::jev::tests::
      - name: Report interactive validation boundary
        run: |
          echo 'AX contract tests do not grant macOS Accessibility permission.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Real application actions and model-driven workflows require the separately authorized Mac acceptance run.' >> "$GITHUB_STEP_SUMMARY"

  smoke-macos:
    name: Smoke (macOS launch)
    # 无 Mac 硬件的启动验证：macOS runner 有 WindowServer，可运行 GUI 程序。
    # 检查实际 .app 启动并提供 ARM64 试用包；进程存活不代表 AX 实机验收通过。
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: |
          npm ci
          cd frontend && npm ci
      - name: Build macOS test app
        run: npx tauri build --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - name: Sign test app and verify embedded libraries
        run: |
          codesign --force --deep --sign - target/debug/bundle/macos/Nuphus.app
          codesign --verify --deep --strict target/debug/bundle/macos/Nuphus.app
      - name: Verify bundled vision runtime
        run: |
          cargo build -p desktop-api --example macos_runtime_smoke
          env -u ORT_DYLIB_PATH target/debug/examples/macos_runtime_smoke "$PWD/target/debug/bundle/macos/Nuphus.app"
      - name: Launch smoke test
        run: |
          ./target/debug/bundle/macos/Nuphus.app/Contents/MacOS/nuphus > /tmp/nuphus_smoke.log 2>&1 &
          APP_PID=$!
          sleep 12
          if kill -0 $APP_PID 2>/dev/null; then
            echo "APP ALIVE (pid=$APP_PID)"
            kill $APP_PID || true
          else
            echo "APP CRASHED — last log lines:"
            tail -30 /tmp/nuphus_smoke.log || true
            exit 1
          fi
      - name: Package macOS test app
        run: ditto -c -k --sequesterRsrc --keepParent target/debug/bundle/macos/Nuphus.app nuphus-macos-arm64-rpa.zip
      - name: Build and verify macOS test DMG
        run: |
          stage_dir=$(mktemp -d)
          ditto target/debug/bundle/macos/Nuphus.app "$stage_dir/Nuphus.app"
          ln -s /Applications "$stage_dir/Applications"
          hdiutil create -volname Nuphus -srcfolder "$stage_dir" -format UDZO nuphus-macos-arm64-rpa.dmg
          hdiutil verify nuphus-macos-arm64-rpa.dmg
          mount_dir=$(mktemp -d)
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" nuphus-macos-arm64-rpa.dmg
          trap 'hdiutil detach "$mount_dir" || true' EXIT
          codesign --verify --deep --strict "$mount_dir/Nuphus.app"
          lipo "$mount_dir/Nuphus.app/Contents/MacOS/nuphus" -verify_arch arm64
          test "$(readlink "$mount_dir/Applications")" = /Applications
          env -u ORT_DYLIB_PATH target/debug/examples/macos_runtime_smoke "$mount_dir/Nuphus.app"
          shasum -a 256 nuphus-macos-arm64-rpa.dmg > nuphus-macos-arm64-rpa.dmg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nuphus-macos-arm64-rpa-dmg-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            nuphus-macos-arm64-rpa.dmg
            nuphus-macos-arm64-rpa.dmg.sha256
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: nuphus-macos-arm64-rpa-${{ github.event.pull_request.head.sha || github.sha }}
          path: nuphus-macos-arm64-rpa.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-log
          path: /tmp/nuphus_smoke.log
          retention-days: 7

  frontend:
    name: Frontend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vitest 4 requires Node >= 20 (ERR_REQUIRE_ESM on Node 18)
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: ESLint check
        run: npx eslint . --ext .ts,.tsx
      - name: Vitest
        # --no-file-parallelism: CI 低资源 runner 上 fork worker 偶发启动失败
        run: npx vitest run --no-file-parallelism
      - name: Prettier format check
        run: npx prettier --check "src/**/*.{ts,tsx,css}"
