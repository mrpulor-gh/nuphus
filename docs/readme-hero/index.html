<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Nuphus README Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { background: #F8FAFC; }

  .stage {
    position: relative;
    width: 1560px;
    height: 900px;
    overflow: hidden;
    background:
      radial-gradient(900px 500px at 18% 12%, rgba(59, 130, 246, 0.10), transparent 60%),
      radial-gradient(800px 520px at 88% 88%, rgba(139, 92, 246, 0.09), transparent 60%),
      radial-gradient(1200px 700px at 50% 50%, rgba(226, 232, 240, 0.55), transparent 70%),
      linear-gradient(160deg, #FFFFFF 0%, #F1F5F9 48%, #FFFFFF 100%);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  }

  /* subtle grid texture */
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(15, 23, 42, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(1000px 600px at 50% 40%, #000 30%, transparent 75%);
            mask-image: radial-gradient(1000px 600px at 50% 40%, #000 30%, transparent 75%);
  }

  /* brand header */
  .brand {
    position: absolute;
    top: 44px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
  }
  .brand h1 {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: #0F172A;
    text-shadow: 0 2px 24px rgba(37, 99, 235, 0.18);
  }
  .brand p {
    margin-top: 12px;
    font-size: 17px;
    letter-spacing: 0.18em;
    color: #64748B;
  }
  .brand .accent {
    color: #2563EB;
  }

  /* desktop app window */
  .desktop {
    position: absolute;
    left: 390px;
    top: 200px;
    width: 900px;
    height: 600px;
    border-radius: 22px;
    border: 1px solid rgba(15, 23, 42, 0.10);
    box-shadow:
      0 48px 120px rgba(15, 23, 42, 0.22),
      0 12px 36px rgba(15, 23, 42, 0.14);
    overflow: hidden;
    background: #0E1116;
  }
  .desktop img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
  }
  /* soft top glow on desktop window */
  .desktop::after {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  }

  /* phone mockup */
  .phone {
    position: absolute;
    left: 270px;
    top: 240px;
    width: 240px;
    height: 520px;
    border-radius: 36px;
    background: #0C0C0E;
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow:
      0 60px 140px rgba(0,0,0,0.68),
      0 18px 44px rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(0,0,0,0.6);
    z-index: 6;
  }
  .phone-screen {
    position: absolute;
    inset: 8px;
    border-radius: 29px;
    overflow: hidden;
    background: #fff;
  }
  .phone-screen img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  /* Dynamic Island */
  .phone-notch {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 74px;
    height: 20px;
    border-radius: 11px;
    background: #050506;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.06);
    z-index: 3;
  }
  /* side buttons */
  .phone-btn { position: absolute; background: #2B2F38; border-radius: 2px; }
  .phone-btn.vol-up   { left: -3px;  top: 96px; width: 4px; height: 50px; }
  .phone-btn.vol-down { left: -3px;  top: 156px; width: 4px; height: 50px; }
  .phone-btn.power    { right: -3px; top: 130px; width: 4px; height: 78px; }

  /* bottom footer hint */
  .footer {
    position: absolute;
    bottom: 34px;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 5;
  }
  .footer span {
    font-size: 13px;
    letter-spacing: 0.24em;
    color: #94A3B8;
  }
  .footer .dot { color: #2563EB; }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <h1>NUPHUS</h1>
      <p>你的智慧 <span class="accent">AI</span> 协作伙伴 · 桌面与手机，同一对话</p>
    </div>

    <div class="desktop">
      <img src="desktop.png" alt="Nuphus Desktop">
    </div>

    <div class="phone">
      <div class="phone-screen">
        <img src="mobile.png" alt="Nuphus Mobile">
      </div>
      <div class="phone-notch"></div>
      <div class="phone-btn vol-up"></div>
      <div class="phone-btn vol-down"></div>
      <div class="phone-btn power"></div>
    </div>

    <div class="footer">
      <span><span class="dot">●</span> DESKTOP <span class="dot" style="margin-left:18px">●</span> MOBILE</span>
    </div>
  </div>

  <script>
    function fit() {
      var stage = document.querySelector('.stage');
      var s = Math.min(window.innerWidth / 1560, window.innerHeight / 900);
      var w = 1560 * s, h = 900 * s;
      stage.style.transform = 'scale(' + s + ')';
      stage.style.transformOrigin = 'top left';
      stage.style.left = Math.max(0, (window.innerWidth - w) / 2) + 'px';
      stage.style.top = Math.max(0, (window.innerHeight - h) / 2) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
