# MCP Server Configuration
# Nuphus reads it at startup and lazily connects to servers on first use.
#
# Format:
#   servers:
#     <server-key>:
#       command: "<executable>"
#       args: ["<arg1>", "<arg2>", ...]
#       env:
#         <VAR>: "<value>"
#       timeout_ms: 30000       # per-call timeout (default 30s)
#       auto_start: false       # start on Nuphus launch? (default false)

servers:
  vscode:
    # 保持通用写法（不硬编码绝对路径）：代码层在 Windows 下会先直接 spawn，
    # 找不到程序（如 npx 是 .cmd 非 .exe）时自动用 cmd.exe /c 兜底重试。
    # 这样对全体用户生效，无论 Node.js 装在什么位置。
    command: "npx"
    args: ["-y", "vscode-mcp-server"]
    timeout_ms: 30000
    auto_start: false

  # ── Nuphus 自用 MCP server（双通道 / dogfooding）──
  # 显式配置是可选的：未配置时 Nuphus 会尝试自动发现与自身同 target 目录的
  # nuphus-mcp 二进制（cargo build -p nuphus-mcp 后即存在）。
  # 如需固定使用某个路径/参数/超时，可取消注释并修改：
  # nuphus-mcp:
  #   command: "C:\\path\\to\\nuphus-mcp.exe"
  #   args: []
  #   env: {}
  #   timeout_ms: 60000
  #   auto_start: false
  #
  # 整体关闭双通道（总是直连）：环境变量 NUPHUS_MCP_DUAL=off