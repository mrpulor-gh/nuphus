# MCP Server Configuration
# Nuphus reads it at startup and lazily connects to servers on first use.
#
# Format:
#   servers:
#     <server-key>:
#       command: "<executable>"
#       args: ["<arg1>", "<arg2>", ...]
#       env:
#         <VAR>: "<value>"
#       timeout_ms: 30000       # per-call timeout (default 30s)
#       auto_start: false       # start on Nuphus launch? (default false)
#
# Example:
#   servers:
#     github:
#       command: "npx"
#       args: ["-y", "@modelcontextprotocol/server-github"]
#       env:
#         GITHUB_PERSONAL_ACCESS_TOKEN: "<token>"
#
# 当前无已配置的 server。按需在 servers 下添加条目；
# 接入方式见 skill: mcp-tools（skill_read mcp-tools）。

servers: {}
