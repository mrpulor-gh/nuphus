# Goal-Type Execution Warmup Reminders
#
# Compile-time embedded via include_str! into ExecAgent prompt.
# One section per goal_type, 5-6 reminders each.
# Every reminder: short, executable, concrete. No "注意"/"小心" filler words.
#
# Naming: snake_case keys match GoalType serde rename.

[project_analysis]
reminders = [
    "先读入口文件建立全局视图，再逐层深入，禁止一上来就罗列文件清单",
    "识别关键数据流和控制流，不只罗列文件——标注数据从哪来、到哪去、经哪些模块变换",
    "标注不确定的推断为推测，区分'已确认'和'待验证'的事实级别",
    "检查模块间的耦合点：循环依赖、隐式依赖、跨层调用",
    "输出结构化报告：分层架构图 → 核心链路 → 风险点 → 演进建议，而非散落发现",
    "分析前先查询历史分析结果，避免重复分析已确认的模块",
]

[code_generation]
reminders = [
    "修改函数签名后立即检查所有调用方是否兼容，不要等编译报错再回头改",
    "写完代码后执行编译和测试验证，禁止假设它能跑",
    "优先在现有模块内扩展实现，避免新增特殊规则破坏架构一致性",
    "修改配置项时确认所有引用该配置的代码路径都已覆盖",
    "阅读至少 3 个同类文件后再动笔，确保风格一致",
    "禁止为了完成当前任务引入临时补丁、硬编码业务逻辑或测试特判",
]

[debug_diagnose]
reminders = [
    "先复现问题再假设根因，禁止跳过复现步骤直奔猜测的修复",
    "区分症状、诱因、根因三层：症状是表象，诱因是触发条件，根因是底层缺陷——不要把症状当根因",
    "修复后执行双验证：原问题消失 且 没有引入新问题（回归测试或至少手动验证关键路径）",
    "收集完整证据链后再动手：错误日志、调用链、环境状态、最近的代码变更",
    "优先选择根治方案，避免用 try-catch 吞异常或加延迟来绕过问题",
    "修复完成后标记 verified=true，记录根因和修复方案供后续参考",
]

[file_operation]
reminders = [
    "修改前先 stat 确认文件存在和当前状态，禁止基于记忆猜测路径",
    "修改后 read 验证内容正确——Write 返回 success 不等于内容正确",
    "优先用 Edit 增量编辑，避免 Write 全量覆盖丢失文件中其他内容",
    "批量操作前先在单个文件上验证命令或编辑模式正确性",
    "不猜测文件路径，先用 Glob 或 ListDir 确认实际位置",
    "文件移动或重命名后检查所有引用该路径的代码和配置",
]

[research_query]
reminders = [
    "每个关键结论至少 3 个独立来源交叉验证，单一来源不足采信",
    "区分来源权重：官方文档 > 权威媒体/论文 > 社区讨论/博客",
    "结果必须标注来源 URL，方便后续追溯验证",
    "对相互矛盾的信息优先采信官方或原始来源，并注明矛盾点和选择理由",
    "区分事实陈述和观点判断，不要将社区观点包装为官方结论",
    "搜索结果为空或质量低时换关键词重试，不要用模糊推断填补空白",
]

[scripting_exec]
reminders = [
    "检查 stderr 输出——warnings 可能是隐藏的错误信号，不要只看 stdout",
    "exit_code 必须为 0，非零必须解释原因并决定是否终止后续步骤",
    "长时间命令拆分为阶段执行，每阶段验证成功后再继续下一阶段",
    "Windows 上 PowerShell 用分号 ; 而非 && 连接多条命令",
    "执行前先用 --help 或 dry-run 模式确认参数正确，禁止凭记忆拼命令",
    "涉及文件系统写入的命令先在安全目录测试，确认无误后再对目标路径执行",
]
