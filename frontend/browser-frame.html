<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuphus 浏览器</title>
    <!-- 壳页面：独立浏览器窗口顶部的 44px 控制器（React 入口见 /src/browser-frame/index.tsx）。
         与主窗口同源（tauri://localhost / devUrl），因此 window.__TAURI_INTERNALS__ 与
         invoke 桥由 tauri 注入（manager/webview.rs 对每个 webview 注入，含 add_child 的子
         webview）——壳页面能 invoke 应用命令，但 plugin:event|listen 等插件命令受
         capabilities/default.json 的 windows 列表管辖，browser-* 不在表内 →  ACL 拒绝，
         故壳页面纯轮询驱动（见 BrowserFrame.tsx 头注释）。样式由 index.tsx import。 -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/browser-frame/index.tsx"></script>
  </body>
</html>
