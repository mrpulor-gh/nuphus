<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuphus</title>
    <!-- BUILD-SENTINEL-20260908-SKIP-HIDDEN-CSS -->
    <style>
      :root {
        --font-ui:
          system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --ink: #111111;
        --ink-2: #444444;
        --ink-3: #777777;
        --ink-4: #999999;
        --paper: #ffffff;
        --paper-2: #fafafa;
        --track: #ececec;
        --hairline: #e5e5e5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }

      /* ── 等待态（默认）：logo + hint ── */
      .logo {
        position: relative;
      }
      /* 下载态：logo 与 hint 一起让位 —— 面板自带「标题 / 百分比 / 文件名」三段，
         hint 的实时文案与面板信息重复（极简原则：同一时刻只留一套信息） */
      body.downloading .logo,
      body.downloading .hint {
        display: none;
      }
      .nv-eye {
        transform-box: fill-box;
      }
      .nv-whole {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* idle：呼吸 + 眨眼 */
      @keyframes nvBreathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.016);
        }
      }
      @keyframes nvBlink {
        0%,
        91%,
        100% {
          transform: scaleY(1);
        }
        94% {
          transform: scaleY(0.08);
        }
        97% {
          transform: scaleY(1);
        }
      }
      .st-idle .nv-whole {
        animation: nvBreathe 4.8s ease-in-out infinite;
      }
      .st-idle .nv-eye {
        transform-origin: center;
        animation: nvBlink 4.6s ease-in-out infinite;
      }

      .hint {
        font-size: 12px;
        color: var(--ink-3);
        letter-spacing: 0.06em;
        transition: opacity 0.3s ease;
      }

      /* ── 下载态：极简四段式（抬头 → 百分比 → 进度条 → 文件名），整体居中。
         黑白反色纪律：纸白底 + 墨色元素，不用彩色 ── */
      .dl-panel {
        display: none;
        flex-direction: column;
        align-items: center;
        width: 280px;
        gap: 14px;
      }
      body.downloading .dl-panel {
        display: flex;
      }

      /* 抬头与百分比成一组：抬头弱、数字强——视线先落在「还要多久」 */
      .dl-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .dl-title {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-3);
        letter-spacing: 0.12em;
      }
      .dl-pct {
        min-height: 26px;
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .dl-file {
        max-width: 100%;
        font-size: 10px;
        color: var(--ink-4);
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 进度条：pct 已知时定宽过渡；未知（pct: null）时不定宽滑动。
         品牌纪律：黑白反色——实心墨色填充，不用彩色渐变 */
      .bar {
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--ink);
        transition: width 0.25s ease;
      }
      .bar.indeterminate .bar-fill {
        width: 30%;
        animation: nvSlide 1.3s ease-in-out infinite;
      }
      @keyframes nvSlide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(440%);
        }
      }

      /* 「后台下载」出口：下载卡住 10s 才出现。
         视觉 = 欢迎页「继续对话」按钮同款药丸（基底底 + 反色文字/描边、hover 反色互换、
         按下微缩）——本页遵循黑白反色纪律，故映射为 paper 底 / ink 字，hover 互换 */
      .skip-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      /* 根治历史「后台下载常显」：作者样式的 display:flex 会覆盖 UA 默认的
         [hidden]{display:none} → hidden 属性设了也白设、按钮永远可见。
         本条（0,2,0 特异性）压过 .skip-wrap（0,1,0），让 hidden 真正生效。 */
      .skip-wrap[hidden] {
        display: none;
      }
      .skip-btn {
        padding: 8px 28px;
        background: var(--paper);
        color: var(--ink);
        border: 2px solid var(--ink);
        border-radius: 999px;
        font-family: var(--font-ui);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        transition:
          background 0.3s ease,
          color 0.3s ease,
          transform 0.2s ease;
      }
      .skip-btn:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .skip-btn:active {
        transform: scale(0.97);
      }
      .skip-btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .skip-note {
        font-size: 10px;
        color: var(--ink-4);
        letter-spacing: 0.02em;
      }

      @media (prefers-reduced-motion: reduce) {
        .st-idle .nv-whole,
        .st-idle .nv-eye,
        .bar.indeterminate .bar-fill {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg class="st-idle" width="64" height="64" viewBox="0 0 256 256" fill="none">
        <g class="nv-whole">
          <path
            d="M64 20 H192 A44 44 0 0 1 236 64 V156"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            d="M200 236 H64 A44 44 0 0 1 20 192 V64 A44 44 0 0 1 64 20"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            class="nv-eye l"
            d="M80 180 L80 76"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            class="nv-eye r"
            d="M176 180 L176 76"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
        </g>
      </svg>
    </div>
    <div class="hint">正在启动…</div>

    <!-- 下载面板：仅真实模型下载（splash:progress 携带 pct）时由 splash.js 亮出 -->
    <div class="dl-panel" id="dlPanel">
      <div class="dl-meta">
        <div class="dl-title">正在下载内置模型</div>
        <div class="dl-pct" id="dlPct"></div>
      </div>
      <div class="bar indeterminate" id="bar" hidden><div class="bar-fill" id="barFill"></div></div>
      <div class="dl-file" id="dlFile"></div>
    </div>

    <div id="skipWrap" class="skip-wrap" hidden>
      <button id="skipBtn" class="skip-btn">后台下载</button>
      <div class="skip-note">除视觉定位，不影响正常使用！</div>
    </div>
    <!-- 进度由 splash.js 监听 splash:progress 事件驱动（旧 setStatus 定义在
       内联 <script>，被 CSP script-src 'self' 拦截从未执行过；withGlobalTauri 注入的
       __TAURI__ 走 AddScriptToExecuteOnDocumentCreated，不受页面 CSP 限制） -->
    <!-- 版本号缓存破坏符：WebView2 曾长期缓存旧版 splash.js（URL 不变缓存不失效），
       导致"已全就绪仍显示后台下载"改了源码也变不过来的历史根因之一。
       每次改 splash.js 必须同时 bump 这个版本号，强制 WebView2 换 URL 重新拉取。 -->
    <script src="splash.js?v=20260922"></script>
  </body>
</html>
