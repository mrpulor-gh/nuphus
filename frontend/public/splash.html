<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuphus</title>
    <!-- BUILD-SENTINEL-20260826-SPLASH-NODL-BTN -->
    <style>
      :root {
        --font-ui:
          system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --ink: #111111;
        --ink-2: #444444;
        --ink-3: #777777;
        --ink-4: #999999;
        --paper: #ffffff;
        --paper-2: #fafafa;
        --track: #ececec;
        --hairline: #e5e5e5;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--paper);
        overflow: hidden;
        font-family: var(--font-ui);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      /* ── 等待态（默认）：logo + hint ── */
      .logo {
        position: relative;
      }
      /* 下载面板出现时，logo 缩小让位（节奏：视口小，download 面板更高） */
      body.downloading .logo {
        display: none;
      }
      .nv-eye {
        transform-box: fill-box;
      }
      .nv-whole {
        transform-box: fill-box;
        transform-origin: center;
      }

      /* idle：呼吸 + 眨眼 */
      @keyframes nvBreathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.016);
        }
      }
      @keyframes nvBlink {
        0%,
        91%,
        100% {
          transform: scaleY(1);
        }
        94% {
          transform: scaleY(0.08);
        }
        97% {
          transform: scaleY(1);
        }
      }
      .st-idle .nv-whole {
        animation: nvBreathe 4.8s ease-in-out infinite;
      }
      .st-idle .nv-eye {
        transform-origin: center;
        animation: nvBlink 4.6s ease-in-out infinite;
      }

      .hint {
        font-size: 12px;
        color: var(--ink-2);
        letter-spacing: 0.02em;
        transition: opacity 0.3s ease;
      }

      /* ── 下载态：面板式布局，黑白反色纪律（纸白底 + 墨色元素）── */
      .dl-panel {
        display: none;
        flex-direction: column;
        align-items: stretch;
        width: 212px;
        gap: 8px;
      }
      body.downloading .dl-panel {
        display: flex;
      }

      .dl-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .dl-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        letter-spacing: 0.02em;
      }
      .dl-pct {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        font-weight: 600;
      }
      .dl-file {
        font-size: 10px;
        color: var(--ink-3);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 进度条：pct 已知时定宽过渡；未知（pct: null）时不定宽滑动。
         品牌纪律：黑白反色——实心墨色填充，不用彩色渐变 */
      .bar {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: var(--track);
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--ink);
        transition: width 0.25s ease;
      }
      .bar.indeterminate .bar-fill {
        width: 30%;
        animation: nvSlide 1.3s ease-in-out infinite;
      }
      @keyframes nvSlide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(440%);
        }
      }

      /* 「后台下载」出口：下载卡住 10s 才出现。黑白反色——纸白底墨字
         墨描边，hover 反转为墨底纸白字 */
      .skip-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .skip-btn {
        font-size: 11px;
        color: var(--ink);
        background: none;
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 3px 12px;
        cursor: pointer;
        font-family: var(--font-ui);
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .skip-btn:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .skip-note {
        font-size: 10px;
        color: var(--ink-4);
      }

      @media (prefers-reduced-motion: reduce) {
        .st-idle .nv-whole,
        .st-idle .nv-eye,
        .bar.indeterminate .bar-fill {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg class="st-idle" width="64" height="64" viewBox="0 0 256 256" fill="none">
        <g class="nv-whole">
          <path
            d="M64 20 H192 A44 44 0 0 1 236 64 V156"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            d="M200 236 H64 A44 44 0 0 1 20 192 V64 A44 44 0 0 1 64 20"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            class="nv-eye l"
            d="M80 180 L80 76"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
          <path
            class="nv-eye r"
            d="M176 180 L176 76"
            stroke="#111111"
            stroke-width="24"
            stroke-linecap="round"
            fill="none"
          />
        </g>
      </svg>
    </div>
    <div class="hint">正在启动…</div>

    <!-- 下载面板：仅真实模型下载（splash:progress 携带 pct）时由 splash.js 亮出 -->
    <div class="dl-panel" id="dlPanel">
      <div class="dl-head">
        <span class="dl-title">正在下载内置模型</span>
        <span class="dl-pct" id="dlPct"></span>
      </div>
      <div class="bar indeterminate" id="bar" hidden><div class="bar-fill" id="barFill"></div></div>
      <div class="dl-file" id="dlFile"></div>
    </div>

    <div id="skipWrap" class="skip-wrap" hidden>
      <button id="skipBtn" class="skip-btn">后台下载</button>
      <div class="skip-note">除视觉定位，不影响正常使用！</div>
    </div>
    <!-- 进度由 splash.js 监听 splash:progress 事件驱动（旧 setStatus 定义在
       内联 <script>，被 CSP script-src 'self' 拦截从未执行过；withGlobalTauri 注入的
       __TAURI__ 走 AddScriptToExecuteOnDocumentCreated，不受页面 CSP 限制） -->
    <!-- 版本号缓存破坏符：WebView2 曾长期缓存旧版 splash.js（URL 不变缓存不失效），
       导致"已全就绪仍显示后台下载"改了源码也变不过来的历史根因之一。
       每次改 splash.js 必须同时 bump 这个版本号，强制 WebView2 换 URL 重新拉取。 -->
    <script src="splash.js?v=20260831"></script>
  </body>
</html>
