# ──────────────────────────────────────────────────────────────────────
# Capability 路由
#   留空则使用 model 字段对应的主模型。
#   vision : 视觉识别（截图理解、图像分析）
#   stt    : 语音转文字
#   tts    : 文字转语音
# ──────────────────────────────────────────────────────────────────────

[capabilities]
vision = ""
stt = ""
tts = ""